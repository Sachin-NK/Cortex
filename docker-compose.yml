version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app/backend
    # Module path: backend is a package inside /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
