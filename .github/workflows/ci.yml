name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: cortex

      - name: Run all tests (mock provider — no API keys required)
        run: python -m pytest backend/tests/ -v --asyncio-mode=auto --tb=short
        working-directory: cortex
        env:
          ENABLE_MOCK_PROVIDER: "true"
          CORTEX_STATE_DB: "/tmp/cortex_test.db"

      - name: Lint with ruff
        run: ruff check backend/
        working-directory: cortex
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortex/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cortex/frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: cortex/frontend

      - name: Build
        run: npm run build
        working-directory: cortex/frontend

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cortex-backend ./backend
        working-directory: cortex

      - name: Build frontend image
        run: docker build -t cortex-frontend ./frontend
        working-directory: cortex
