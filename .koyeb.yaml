name: cortex-backend
services:
  - name: api
    type: web
    instance_type: free
    regions:
      - was
    git:
      repository: github.com/YOUR_GITHUB_USERNAME/cortex
      branch: main
      buildpack:
        build_command: pip install -r backend/requirements.txt
        run_command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - port: 8000
        protocol: http
    health_checks:
      - path: /health
        port: 8000
    env:
      - key: ENABLE_MOCK_PROVIDER
        value: "false"
      - key: CORTEX_STATE_DB
        value: /tmp/cortex_state.db
      - key: PRIVACY_TIER
        value: standard
